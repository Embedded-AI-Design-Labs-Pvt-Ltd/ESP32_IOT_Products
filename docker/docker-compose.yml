services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  simulator:
    build:
      context: ..
      dockerfile: docker/Dockerfile.sim
    ports:
      - "8080:8080"
    environment:
      - IOT_MODE=simulation
      - MQTT_URI=mqtt://mosquitto:1883
    depends_on:
      - mosquitto

  idf-builder:
    build:
      context: ..
      dockerfile: docker/Dockerfile.idf
    profiles: ["hardware"]
    volumes:
      - ..:/project
    working_dir: /project
    command: bash -lc "idf.py set-target esp32c3 && idf.py build"

  jenkins:
    image: jenkins/jenkins:lts-jdk17
    profiles: ["ci"]
    ports:
      - "8090:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  jenkins_home:
